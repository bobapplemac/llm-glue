[roles]
agent = true
server = true
client = true

[[agent.providers]]
type = "ollama"
name = "local-ollama"
url = "http://127.0.0.1:11434"

[server]
listen = "https://127.0.0.1:8765"
tls_auto_generate = true
tls_server_names = ["localhost"]
state_directory = "state"
artifact_retention = 5

[client]

[[client.targets]]
type = "opencode"
path = 'C:\ProgramData\opencode\opencode.jsonc'
deny_builtin_opencode_provider = true
