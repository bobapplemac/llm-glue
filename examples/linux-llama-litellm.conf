[roles]
agent = true
server = true
client = true

[[agent.providers]]
type = "llama.cpp"
name = "local-llama"
url = "http://127.0.0.1:8081"
model_directories = ["/mnt/models/gguf"]

[server]
listen = "http://127.0.0.1:8765"

[client]
source = "http://127.0.0.1:8765"

[[client.targets]]
type = "litellm"
path = "/opt/litellm/llm-glue-models.yaml"
activation_command = "systemctl restart litellm.service"
