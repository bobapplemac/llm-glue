[roles]
agent = true
server = true
client = true

[[agent.providers]]
type = "llama.cpp"
name = "local-llama"
url = "http://127.0.0.1:8081"
model_directories = ["/mnt/models/gguf"]
# For a containerized router, explicitly map its reported prefix to the
# host-visible allowlisted directory. Omit this when paths are identical.
# model_path_mappings = ["/models=/mnt/models/gguf"]
inspect_gguf = true
# Full-file SHA-256 can be expensive for large models; enable only when required.
hash_model_files = false
# Functional inference is opt-in; loaded-only never wakes a dormant router model.
probe_mode = "loaded-only"
probe_timeout_seconds = 30
# Router preset refreshes may inspect large GGUF headers serially after changes.
discovery_timeout_seconds = 300

[server]
listen = "https://127.0.0.1:8765"
tls_auto_generate = true
tls_server_names = ["localhost", "labhost03.heimges.local"]
# OpenCode clients must use the externally reachable LiteLLM endpoint, not the
# private llama.cpp router URL used for discovery and generated LiteLLM routes.
opencode_inference_url = "http://labhost03:4000"
opencode_inference_api_key_environment = "LLM_GLUE_INFERENCE_API_KEY"
state_directory = "/var/lib/llm-glue"
artifact_retention = 5

[client]
# An omitted source uses the co-located Server and pins its generated public key.

[[client.targets]]
type = "litellm"
path = "/opt/litellm/llm-glue-models.yaml"
primary_config_path = "/opt/litellm/config.yaml"
service_name = "litellm.service"
health_url = "http://127.0.0.1:4000/health/liveliness"

[logging]
file = "/var/log/llm-glue/llm-glue.log"
level = "Information"
archive_size_mb = 10
retention = 7
