[roles]
agent = true
server = true
client = true

[[agent.providers]]
type = "llama.cpp"
name = "local-llama"
url = "http://127.0.0.1:8081"
model_directories = ["/mnt/models/gguf"]
inspect_gguf = true
# Full-file SHA-256 can be expensive for large models; enable only when required.
hash_model_files = false
# Functional inference is opt-in; loaded-only never wakes a dormant router model.
probe_mode = "loaded-only"
probe_timeout_seconds = 30

[server]
listen = "http://127.0.0.1:8765"
# OpenCode clients must use the externally reachable LiteLLM endpoint, not the
# private llama.cpp router URL used for discovery and generated LiteLLM routes.
opencode_inference_url = "http://labhost03:4000"
state_directory = "/var/lib/llm-glue"
artifact_retention = 5

[client]
source = "http://127.0.0.1:8765"

[[client.targets]]
type = "litellm"
path = "/opt/litellm/llm-glue-models.yaml"
primary_config_path = "/opt/litellm/config.yaml"
service_name = "litellm.service"
health_url = "http://127.0.0.1:4000/health/liveliness"

[logging]
file = "/var/log/llm-glue/llm-glue.log"
level = "Information"
archive_size_mb = 10
retention = 7
