[roles]
agent = true
server = false
client = false

[agent]
submit_to = "https://llm-glue.internal.example:8765"
write_token_environment = "LLM_GLUE_WRITE_TOKEN"
# Prefer a pin copied from `llm-glue doctor` on the Server. To accept any
# self-signed certificate instead, omit the pin and set
# allow_invalid_server_certificate = true.
trusted_server_public_key_sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# Optional local export boundary; supports exact names plus * and ? wildcards.
# exclude_models = ["private-*", "ollama/remote-workstation/experimental-?"]
discovery_interval_seconds = 60
removal_grace_seconds = 600

[[agent.providers]]
type = "ollama"
name = "remote-workstation"
url = "http://127.0.0.1:11434"
