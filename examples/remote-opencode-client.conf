[roles]
agent = false
server = false
client = true

[client]
source = "https://llm-glue.internal.example"
token_environment = "LLM_GLUE_READ_TOKEN"

[[client.targets]]
type = "opencode"
path = 'C:\ProgramData\opencode\opencode.jsonc'
deny_builtin_opencode_provider = true

# To target selected users instead of the machine-wide file, replace the entry
# above with one explicit block per user. LLM Glue does not enumerate profiles.
