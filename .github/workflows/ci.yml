name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LlmGlue.slnx
      - run: dotnet build LlmGlue.slnx -c Release --no-restore
      - run: dotnet test LlmGlue.slnx -c Release --no-build --verbosity minimal
      - if: runner.os == 'Linux'
        run: make help
      - if: runner.os == 'Linux'
        run: bash scripts/test-release-preflight.sh
      - if: runner.os == 'Linux'
        run: dotnet publish src/LlmGlue/LlmGlue.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/bootstrap-test/linux-x64
      - if: runner.os == 'Linux'
        name: Run single-file binary without ICU on Debian 13 slim
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo debian:13-slim artifacts/bootstrap-test/linux-x64/llm-glue --version
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo debian:13-slim artifacts/bootstrap-test/linux-x64/llm-glue config validate --config examples/linux-llama-litellm.conf
      - if: runner.os == 'Linux'
        name: Qualify staged Linux single-file update activation
        run: LLM_GLUE_TEST_BINARY="$PWD/artifacts/bootstrap-test/linux-x64/llm-glue" bash scripts/Test-LinuxSingleFileUpdate.sh
      - if: runner.os == 'Linux'
        run: LLM_GLUE_TEST_BINARY="$PWD/artifacts/bootstrap-test/linux-x64/llm-glue" bash scripts/Test-BootstrapConfigs.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-ReleasePreflight.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet publish src/LlmGlue/LlmGlue.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/bootstrap-test/win-x64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-BootstrapConfigs.ps1 -Binary artifacts/bootstrap-test/win-x64/llm-glue.exe
